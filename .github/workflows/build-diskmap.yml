name: Build DiskMap app

# 수동 실행(workflow_dispatch)하거나, diskmap-v* 태그를 push하면 빌드합니다.
# 태그로 실행하면 결과물을 GitHub Release에 자동으로 첨부합니다.
on:
  workflow_dispatch:
  push:
    tags:
      - "diskmap-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: DiskMap-windows.zip
          - os: macos-latest
            asset: DiskMap-macos.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: DiskMap
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build
        run: pyinstaller diskmap.spec --noconfirm

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/DiskMap.exe -DestinationPath DiskMap-windows.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../DiskMap-macos.zip DiskMap.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: DiskMap/${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DiskMap/${{ matrix.asset }}
